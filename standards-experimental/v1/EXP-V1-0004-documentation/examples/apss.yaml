# Example apss.yaml for a project adopting EXP-V1-0004 (Documentation).
#
# Configuration lives in a single root-level apss.yaml owned by the
# meta-standard (APS-V1-0000.CF01). The documentation standard registers
# the slug "docs" and contributes this docs: section.
#
# Copy the relevant pieces into your project's apss.yaml and customize.
# Every section is default-on; set `disable: true` to opt out of one
# section without disabling the rest (see parent spec section 3.4).
#
# Substandard keys use the substandard's kebab-case slug (matches its
# substandard.toml). Scalar field names inside each section are
# snake_case (matches the Rust struct contract).

schema: "apss.config/v1"

docs:
  adr:
    required_adr_keywords: ["security", "testing"]
