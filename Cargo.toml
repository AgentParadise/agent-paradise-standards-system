[workspace]
resolver = "2"
members = [
    "crates/apss-core",
    "crates/aps-cli",
    "crates/apss-bootstrap",
    "standards/v1/APS-V1-0000-meta",
    "standards/v1/APS-V1-0000-meta/substandards/SS01-substandard-structure",
    "standards/v1/APS-V1-0000-meta/substandards/CL01-cli-contract",
    "standards/v1/APS-V1-0000-meta/substandards/CF01-project-config",
    "standards/v1/APS-V1-0000-meta/substandards/DI01-distribution",
    # Official standards
    "standards/v1/APS-V1-0001-code-topology",
    "standards/v1/APS-V1-0001-code-topology/substandards/3D01-force-directed",
    "standards/v1/APS-V1-0001-code-topology/substandards/VIZ01-dashboard",
    "standards/v1/APS-V1-0001-code-topology/substandards/VIZ01-mermaid",
    "standards/v1/APS-V1-0001-code-topology/substandards/LANG01-rust",
    "standards/v1/APS-V1-0001-code-topology/substandards/CI01-github-actions",
    # Official standards - Architecture Fitness Functions
    "standards/v1/APS-V1-0002-architecture-fitness",
    "standards/v1/APS-V1-0002-architecture-fitness/substandards/0002-MT01-maintainability",
    "standards/v1/APS-V1-0002-architecture-fitness/substandards/0002-MD01-modularity",
    "standards/v1/APS-V1-0002-architecture-fitness/substandards/0002-ST01-structural",
    "standards/v1/APS-V1-0002-architecture-fitness/substandards/0002-SC01-security",
    "standards/v1/APS-V1-0002-architecture-fitness/substandards/0002-LG01-legality",
    "standards/v1/APS-V1-0002-architecture-fitness/substandards/0002-AC01-accessibility",
    "standards/v1/APS-V1-0002-architecture-fitness/substandards/0002-PF01-performance",
    "standards/v1/APS-V1-0002-architecture-fitness/substandards/0002-AV01-availability",
    # Experimental standards
    "standards-experimental/v1/EXP-V1-0002-todo-tracker",
    "standards-experimental/v1/EXP-V1-0003-fitness-functions",
]
exclude = [
]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/AgentParadise/agent-paradise-standards-system"
rust-version = "1.85"

[workspace.dependencies]
# Error handling
thiserror = "2.0"

# Tree-sitter (for language analysis)
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Filesystem
walkdir = "2.5"
glob = "0.3"

# Templates
handlebars = "6.3"

# Version resolution
semver = "1.0"

# JSON Schema validation (test-only - drift detection between producers and schemas)
jsonschema = "0.46"

# Internal crates
apss-core = { version = "1.0.0", path = "crates/apss-core" }
